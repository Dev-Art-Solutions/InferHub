name: docker-publish

on:
  push:
    tags: ['v*']

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        image:
          - name: inferhub-coordinator
            scope: coordinator
            dockerfile: src/InferHub.Coordinator/Dockerfile
            platforms: linux/amd64,linux/arm64
            cache: max
            flavor: ''
            extra-tags: type=raw,value=latest
            reclaim-disk: false

          - name: inferhub-node
            scope: node
            dockerfile: src/InferHub.Node/Dockerfile
            platforms: linux/amd64,linux/arm64
            cache: max
            flavor: ''
            extra-tags: type=raw,value=latest
            reclaim-disk: false

          # The bundled image (phase 39): the same node with Ollama inside it.
          #
          # amd64 only — CUDA-in-a-container on arm64 means Jetson, which needs the jetpack
          # bundles and hardware to test on rather than a matrix entry added blind (D9).
          #
          # `mode=min`, not `max`: this image is ~4 GB and a max-mode cache would thrash the
          # 10 GB GHA cache budget it shares with the other two.
          #
          # Tagged `-ollama` rather than `-gpu` because it runs perfectly well without a card
          # (D2); `gpu` is published as an alias of the same digest for whoever goes looking.
          # The per-tag `suffix=` on those two clears the flavour, which otherwise applies to
          # every tag and would produce `ollama-ollama`.
          - name: inferhub-node
            scope: node-ollama
            dockerfile: src/InferHub.Node/Dockerfile.ollama
            platforms: linux/amd64
            cache: min
            flavor: suffix=-ollama
            extra-tags: |
              type=raw,value=ollama,suffix=
              type=raw,value=gpu,suffix=
            reclaim-disk: true

          # The tools image (phase 42): the bundled node plus a Python venv, Whisper and Piper.
          #
          # amd64 only, for phase-39 D9's reasons, and `mode=min` for phase-39's cache reason with
          # one more image sharing the same 10 GB GHA budget. ~6 GB, which is why reclaim-disk is on
          # — a stock runner has ~14 GB free and this build extracts an Ollama tarball *and*
          # resolves ~1.5 GB of Python wheels.
          - name: inferhub-node
            scope: node-tools
            dockerfile: src/InferHub.Node/Dockerfile.tools
            platforms: linux/amd64
            cache: min
            flavor: suffix=-tools
            extra-tags: type=raw,value=tools,suffix=
            reclaim-disk: true

          # The diffusion image (phase 46): the PLAIN node plus a Python venv, PyTorch and
          # diffusers. It does not stack on :tools and has no Ollama in it (phase-46 D9) — stacking
          # reaches ~15 GB, and a card running a diffusion pipeline has no room for a chat model
          # beside it anyway. Two containers and capability routing is the answer; that is what
          # phase 40 was for.
          #
          # amd64 only, for phase-39 D9's reasons. `cache: none`, not `min`: the torch CUDA wheels
          # alone are several gigabytes and caching them would evict every other image from the
          # 10 GB GHA budget to save a download this job does once per tag.
          #
          # ~9 GB, which is the largest artifact this repository publishes, so `reclaim-disk` is not
          # optional here — a stock runner has ~14 GB free and `pip install torch` unpacks several
          # of them. If this ever stops fitting, the named fallback is publishing this one tag from
          # the GPU box rather than silently dropping it from the matrix.
          - name: inferhub-node
            scope: node-diffusion
            dockerfile: src/InferHub.Node/Dockerfile.diffusion
            platforms: linux/amd64
            cache: none
            flavor: suffix=-diffusion
            extra-tags: type=raw,value=diffusion,suffix=
            reclaim-disk: true

    steps:
      - uses: actions/checkout@v4

      # The bundled image extracts a 1.4 GB tarball into a ~3 GB layer, and a stock runner has
      # around 14 GB free. Reclaiming the toolchains we do not use keeps the build off the edge.
      - name: Reclaim runner disk
        if: matrix.image.reclaim-disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          sudo rm -rf /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v2.3.0 -> :2.3.0, :2.3, :latest   (bundled: :3.7.0-ollama, :3.7-ollama, :ollama, :gpu)
      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image.name }}
          flavor: ${{ matrix.image.flavor }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            ${{ matrix.image.extra-tags }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: ${{ matrix.image.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # `cache: none` means no layer cache at all, and it is spelled as two empty strings rather
          # than as `mode=none` — which buildx does not accept and which would fail the build only
          # after the ~9 GB of wheels had already been pulled. Phase 46's diffusion image is the one
          # entry that uses it: caching several gigabytes of torch would evict every other image
          # from the shared 10 GB GHA budget to save a download this job does once per tag.
          cache-from: ${{ matrix.image.cache == 'none' && '' || format('type=gha,scope={0}', matrix.image.scope) }}
          cache-to: ${{ matrix.image.cache == 'none' && '' || format('type=gha,mode={0},scope={1}', matrix.image.cache, matrix.image.scope) }}
