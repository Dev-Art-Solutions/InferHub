# The diffusion node — a solo node that makes pictures (phase 46, v3.14+).
#
#   docker compose -f deploy/docker/compose.diffusion.yml up -d
#
#   curl http://localhost:5083/v1/images/generations \
#        -H "Authorization: Bearer $INFERHUB_API_KEY" -H 'Content-Type: application/json' \
#        -d '{"model":"sdxl","prompt":"a lighthouse in a storm, oil painting","size":"1024x1024"}' \
#     | jq -r '.data[0].b64_json' | base64 -d > out.png
#
# THIS IMAGE HAS NO OLLAMA IN IT, and that is a decision rather than an omission (phase-46 D9). A
# card running a diffusion pipeline has no room for a chat model beside it, so bundling one would
# ship a combination the docs would have to tell you not to use. Want both? Run two containers and
# let the coordinator route `image` to this one and `chat` to the other — which is exactly what
# phase 40's (capability, model) routing exists for:
#
#   docker compose -f deploy/docker/docker-compose.yml -f deploy/docker/compose.diffusion.yml up -d
#
# YOU NEED A CARD. Unlike compose.tools.yml, the `deploy:` block below is NOT commented out: with
# Tools:Image:RequireGpu at its default the worker refuses to start without CUDA and says which key
# to unset. Unset it and only `sd15` is offered — 512x512, tens of seconds on a modern core. `sdxl`
# at 1024x1024 is minutes on a CPU and is offered only behind Tools:Image:AllowSlowCpu, because a
# feature matrix that ticks "CPU" for the whole feature is a lie told in a checkmark.
#
# NO MANUAL STEP. Unlike the Piper voices in compose.tools.yml, the model a caller names here is
# unambiguous, so weights fetch themselves in the background into /data/tools/hf on the volume —
# Tools__AllowModelDownload is on in this image because choosing it *is* the consent (phase-42 D4).
# A recipe is offered only once its weights are proven loadable, so no request ever waits on a
# download, and from v3.16 you can also pull one deliberately from a coordinator:
#
#   POST /api/admin/nodes/{nodeId}/tools/diffusion/models/flux-schnell/pull
#
# TWO OF THE SIX RECIPES DO NOT START UNTIL YOU ACCEPT THEIR LICENCE (v3.16, phase-48 D5).
# `sd35-medium` is under the Stability AI Community licence and `sdxl-turbo` is non-commercial;
# both are loaded, logged by name and not started until their licence id is in
# Tools:Image:AcceptedLicenses. That is a refusal to make that call for you, silently — not legal
# advice, and not a boolean, because accepting one licence must never enable the other.

name: inferhub-diffusion

services:
  node:
    image: ghcr.io/dev-art-solutions/inferhub-node:diffusion
    container_name: inferhub-node-diffusion
    restart: unless-stopped
    ports:
      - "5083:8080"
    environment:
      LocalApi__Enabled: "true"
      Coordinator__Enabled: "false"

      # NOT optional (phase-37 D4). The container binds a wildcard, and this one occupies a GPU for
      # a minute per call. Put INFERHUB_API_KEY in deploy/docker/.env.
      LocalApi__ApiKeys__0: "${INFERHUB_API_KEY:?set INFERHUB_API_KEY in .env}"

      # One generation at a time is the default and it is deliberate (phase-41 D4): a second
      # pipeline on the same card is a second copy of the weights and an out-of-memory error at the
      # worst possible moment. Capability-aware routing means that in a mesh, a node busy generating
      # is still a candidate for chat.

      # Air-gapped, or you would rather pre-fetch: turn the download off and the worker fails the
      # *job* with the exact `huggingface-cli download` command in the message. The node keeps
      # serving everything else.
      # Tools__AllowModelDownload: "false"

      # No card, and you have read the numbers: this offers sd15 only.
      # Tools__Image__RequireGpu: "false"
      #
      # …and this offers sdxl on a CPU as well. Minutes per image. Your hardware, your call.
      # Tools__Image__AllowSlowCpu: "true"

      # A batch is bounded by bytes, not by count, and the budget is clamped by
      # Tools:MaxAttachmentBytes because that is what sizes the mesh's message limit — exceeding it
      # tears a connection down rather than failing a message (the v3.10.0 bug).
      # Images__MaxBatch: "4"
      # Images__MaxResponseBytes: "26214400"

      # v3.16 — THE VRAM ARITHMETIC, WRITTEN DOWN. Unset means no gate, which is v3.15's behaviour.
      # Set it and a recipe that cannot fit Budget minus Reserve is not declared at all, so the
      # fleet never routes at it; one that would fit but does not right now waits and then gets the
      # same 503 + Retry-After as every other limit here — never an out-of-memory error inside
      # somebody's job. On a 24 GB card:
      # Node__Vram__BudgetMiB: "24576"
      # Node__Vram__ReserveMiB: "2048"

      # v3.16 — the licence consent. Per licence id, because sd35-medium is free for most people who
      # will run it and sdxl-turbo is not usable commercially at all.
      # Tools__Image__AcceptedLicenses__0: "stabilityai-ai-community"
      # Tools__Image__AcceptedLicenses__1: "sai-nc-community"

      # v3.16 — how many models may be on the card at once. Switching recipes swaps weights inside
      # the WARM process, so the default of 1 costs a load and not a restart; raise it on a 48 GB
      # card that alternates between two models and would otherwise thrash.
      # Tools__Image__ResidentRecipes: "2"

      # sd35-medium's repository is GATED on Hugging Face. Accepting its licence above tells this
      # node it may run the model; getting the weights is separate — accept the terms on the model
      # page and put a read token here. It has to be OUR key rather than a plain HF_TOKEN env var:
      # the node clears the child's environment before spawn (phase-41 D3), so a variable set on the
      # container reaches the node and stops there.
      # Tools__Image__HuggingFaceToken: "${HF_TOKEN}"

    volumes:
      # Required in practice. Holds the model weights (~8.7 GB for sdxl + sd15, ~35 GB for all six),
      # the corpus and the node id — without it every `up` re-downloads gigabytes.
      - node-data:/data

    # The GPU. Deliberately not commented out — see the header.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  node-data:
